services:
  postgres:
    image: postgres:16-alpine
    container_name: axiom_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-axiom_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      # Hardened: Bind to localhost (127.0.0.1) only, isolating DB from LAN / public network
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - axiom_net

  chromadb:
    image: chromadb/chroma:0.5.20
    container_name: axiom_chromadb
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      # Hardened: Bind to localhost (127.0.0.1) only, isolating vector store from external network
      - "127.0.0.1:8001:8000"
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - IS_PERSISTENT=TRUE
    networks:
      - axiom_net

  instagram-scraper:
    image: ac-instagram-scraper:1.0.0
    build:
      context: ../AC-InstagramScraper
      dockerfile: Dockerfile
    container_name: axiom_instagram_scraper
    restart: unless-stopped
    ports:
      # Port 8005 di host agar tidak bertabrakan dengan Axiom Backend (8000) & ChromaDB (8001)
      - "127.0.0.1:${SCRAPER_HOST_PORT:-8005}:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - axiom_net

  backend:
    image: axiom-backend:1.0.0
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: axiom_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./data/chromadb:/app/data/chromadb
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - INSTAGRAM_SCRAPER_URL=http://instagram-scraper:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
      instagram-scraper:
        condition: service_started
    networks:
      - axiom_net

  frontend:
    image: axiom-frontend:1.0.0
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: axiom_frontend
    ports:
      - "3000:80"
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - axiom_net

volumes:
  pg_data:
  chroma_data:

networks:
  axiom_net:
    driver: bridge
