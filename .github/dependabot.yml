version: 2
updates:
  # 1. Dependabot untuk Backend (Python)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    target-branch: "dev"          # Semua PR pembaruan diarahkan ke branch dev
    open-pull-requests-limit: 5

  # 2. Dependabot untuk Frontend (Node.js / pnpm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    target-branch: "dev"          # Semua PR pembaruan diarahkan ke branch dev
    open-pull-requests-limit: 5
